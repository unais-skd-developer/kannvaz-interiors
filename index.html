    <meta charset="UTF-8" />

    <title>KANNVAS – Spaces Crafted Beautifully | Interior & Exterior Design Studio</title>
    <!-- Optimized Google Fonts: DNS prefetch + essential font weights only to speed up low-network loading -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=Raleway:wght@400;600;700&family=Titillium+Web:wght@600;700;900&display=swap" rel="stylesheet">
    <style>
      /* Ensure zero white flash & zero blank screen on page refresh */
      html, body {
        background-color: #070708 !important;
        margin: 0;
        padding: 0;
        color: #ffffff;
      }
      .preloader-static-wrap {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background-color: #070708;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        user-select: none;
        overflow: hidden;
      }
      .preloader-glow {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(circle at 50% 40%, rgba(197, 138, 105, 0.16) 0%, rgba(14, 61, 47, 0.08) 40%, transparent 70%);
      }
      .preloader-grid-bg {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 36px 36px;
      }
      .preloader-content {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 16px;
        max-width: 32rem;
        width: 100%;
        text-align: center;
      }
      .preloader-medallion-wrap {
        position: relative;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .preloader-halo-copper {
        position: absolute;
        inset: -16px;
        border-radius: 9999px;
        background: rgba(197, 138, 105, 0.25);
        filter: blur(20px);
        pointer-events: none;
      }
      .preloader-halo-white {
        position: absolute;
        inset: -4px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.15);
        filter: blur(8px);
        pointer-events: none;
      }
      .preloader-emblem-box {
        position: relative;
        width: 78px;
        height: 78px;
        border-radius: 9999px;
        box-shadow: 0 0 24px rgba(197, 138, 105, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      @media (min-width: 640px) {
        .preloader-emblem-box {
          width: 96px;
          height: 96px;
        }
      }
      .preloader-emblem-img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 0 10px rgba(212, 155, 115, 0.4));
        pointer-events: none;
      }
      .preloader-sig-wrap {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        max-width: 76vw;
        margin: -4px auto 0 auto;
      }
      @media (min-width: 640px) {
        .preloader-sig-wrap {
          max-width: 440px;
          margin-top: -8px;
        }
      }
      .preloader-sig-svg {
        width: 100%;
        max-width: 595px;
        height: auto;
        overflow: visible;
        filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.85)) drop-shadow(0 0 24px rgba(255, 255, 255, 0.35));
      }
      /* Frame-0 Handwriting Stroke Masks */
      .static-mask-p0 { animation: static-mask-reveal 0.9s cubic-bezier(0.38, 0.05, 0.22, 1) 0.05s forwards; }
      .static-mask-p1 { animation: static-mask-reveal 0.9s cubic-bezier(0.38, 0.05, 0.22, 1) 0.17s forwards; }
      .static-mask-p2 { animation: static-mask-reveal 0.9s cubic-bezier(0.38, 0.05, 0.22, 1) 0.29s forwards; }
      .static-mask-p3 { animation: static-mask-reveal 0.9s cubic-bezier(0.38, 0.05, 0.22, 1) 0.41s forwards; }
      .static-mask-p4 { animation: static-mask-reveal 0.9s cubic-bezier(0.38, 0.05, 0.22, 1) 0.53s forwards; }
      .static-mask-p5 { animation: static-mask-reveal 0.9s cubic-bezier(0.38, 0.05, 0.22, 1) 0.65s forwards; }
      .static-mask-p6 { animation: static-mask-reveal 0.9s cubic-bezier(0.38, 0.05, 0.22, 1) 0.77s forwards; }
      @keyframes static-mask-reveal {
        0% {
          stroke-dashoffset: 1;
          opacity: 0;
        }
        1% {
          opacity: 1;
        }
        100% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
      }
      .preloader-arc-svg {
        width: 176px;
        height: 16px;
        margin-top: -8px;
        margin-bottom: 8px;
        overflow: visible;
      }
      @media (min-width: 640px) {
        .preloader-arc-svg {
          width: 224px;
          height: 20px;
          margin-top: -12px;
        }
      }
      .preloader-subtitle {
        font-size: 10px;
        text-transform: uppercase;
        font-weight: 600;
        letter-spacing: 0.3em;
        color: #c58a69;
        margin-bottom: 24px;
        font-family: 'Titillium Web', sans-serif;
      }
      @media (min-width: 640px) {
        .preloader-subtitle {
          font-size: 12px;
          letter-spacing: 0.36em;
          margin-bottom: 32px;
        }
      }
      .preloader-bar-wrap {
        width: 192px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      @media (min-width: 640px) {
        .preloader-bar-wrap {
          width: 250px;
        }
      }
      .preloader-bar-track {
        width: 100%;
        height: 2px;
        background-color: #222226;
        border-radius: 9999px;
        overflow: hidden;
      }
      .preloader-bar-fill {
        height: 100%;
        background: linear-gradient(to right, #c58a69, #e5ab87, #ffffff);
        border-radius: 9999px;
        box-shadow: 0 0 8px rgba(229, 171, 135, 0.6);
        animation: preloader-progress-anim 2.2s ease-out forwards;
      }
      @keyframes preloader-progress-anim {
        0% { width: 0%; }
        25% { width: 28%; }
        55% { width: 62%; }
        85% { width: 88%; }
        100% { width: 100%; }
      }
      .preloader-bar-labels {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        font-size: 10px;
        font-family: monospace;
        letter-spacing: 0.1em;
        padding-top: 4px;
      }
      @media (min-width: 640px) {
        .preloader-bar-labels {
          font-size: 11px;
        }
      }
      .preloader-init-text {
        color: #55555c;
      }
      .preloader-pct-text {
        color: #c58a69;
        font-weight: 600;
      }
    </style>
